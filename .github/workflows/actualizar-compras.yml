name: Actualizar monitor de compras públicas

on:
  schedule:
    - cron: "17 12 * * *"   # todos los días, 06:17 hora de Guatemala
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: actualizar-compras
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install pandas ijson

      - name: Descargar datos OCDS de Guatecompras
        run: python compras/scripts/extraer_ocds.py

      - name: Calcular indicadores
        run: python compras/scripts/procesar.py

      - name: Construir la página
        run: python compras/scripts/construir_web.py

      - name: Publicar cambios
        id: publicar
        run: |
          git config user.name "finanzasydatos-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compras/index.html compras/data/monitor_data.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos"; echo "cambio=no" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Monitor de compras: datos al $(python -c 'import json;print(json.load(open("compras/data/monitor_data.json"))["corte"])')"
            git push
            echo "cambio=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Pedir reconstrucción de GitHub Pages
        if: steps.publicar.outputs.cambio == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages se reconstruirá por el push"
